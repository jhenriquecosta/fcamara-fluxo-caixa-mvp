name: cashflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: cashflow
      POSTGRES_DB: cashflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow -d cashflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafkadata:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Aplica o esquema de cada módulo no banco dele e sai; os hosts só sobem depois.
  migrator:
    build:
      context: .
      dockerfile: src/Cashflow.Migrator/Dockerfile
    environment:
      Modules__Lancamentos__ConnectionStrings__Default: Host=postgres;Port=5432;Database=cashflow;Username=lancamentos;Password=lancamentos
      Modules__Consolidado__ConnectionStrings__Default: Host=postgres;Port=5432;Database=cashflow_consolidado;Username=consolidado;Password=consolidado
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # O mesmo Cashflow.WebAPI duas vezes, cada uma com um módulo ligado: uma queda do
  # consolidado não derruba os lançamentos (ADR-0001, ADR-0009).
  lancamentos-api:
    image: cashflow/webapi:local
    build:
      context: .
      dockerfile: src/Cashflow.WebAPI/Dockerfile
    environment: &webapi
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ServiceName: lancamentos
      Modules__Lancamentos__Enabled: "true"
      Modules__Lancamentos__ConnectionStrings__Default: Host=postgres;Port=5432;Database=cashflow;Username=lancamentos;Password=lancamentos
      Modules__Consolidado__Enabled: "false"
      Auth__Issuer: cashflow-local
      Auth__Audience: cashflow-api
      Auth__SigningKey: dev-only-signing-key-change-me-32-chars-min
      Serilog__ElasticsearchUrl: http://elasticsearch:9200
    ports:
      - "8080:8080"
    depends_on: &webapi-deps
      migrator:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_started

  consolidado-api:
    image: cashflow/webapi:local
    environment:
      <<: *webapi
      ServiceName: consolidado
      Modules__Lancamentos__Enabled: "false"
      Modules__Consolidado__Enabled: "true"
      Modules__Consolidado__ConnectionStrings__Default: Host=postgres;Port=5432;Database=cashflow_consolidado;Username=consolidado;Password=consolidado
    ports:
      - "8081:8080"
    depends_on:
      lancamentos-api:
        condition: service_started
      <<: *webapi-deps

  # O publicador do outbox (Lançamentos) e o consumidor do barramento (Consolidado).
  background-server:
    build:
      context: .
      dockerfile: src/Cashflow.BackgroundServer/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ServiceName: background-server
      Modules__Lancamentos__ConnectionStrings__Default: Host=postgres;Port=5432;Database=cashflow;Username=lancamentos;Password=lancamentos
      Modules__Consolidado__ConnectionStrings__Default: Host=postgres;Port=5432;Database=cashflow_consolidado;Username=consolidado;Password=consolidado
      MessageBroker__Provider: Kafka
      MessageBroker__Kafka__BootstrapServers: kafka:9092
      Auth__Issuer: cashflow-local
      Auth__Audience: cashflow-api
      Auth__SigningKey: dev-only-signing-key-change-me-32-chars-min
      Serilog__ElasticsearchUrl: http://elasticsearch:9200
    ports:
      - "8082:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_started

  # O frontend (ADR-0010): mais um cliente da API, com um endereço por serviço — com o
  # consolidado fora, as telas de lançamento seguem funcionando. Usuários de demo no
  # appsettings.Development.json (senhas só em hash); o token de acesso não sai do servidor.
  web:
    build:
      context: .
      dockerfile: src/Cashflow.BlazorServerSide/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ServiceName: web
      ResourceServer__Lancamentos: http://lancamentos-api:8080
      ResourceServer__Consolidado: http://consolidado-api:8080
      Auth__Issuer: cashflow-local
      Auth__Audience: cashflow-api
      Auth__SigningKey: dev-only-signing-key-change-me-32-chars-min
      Serilog__ElasticsearchUrl: http://elasticsearch:9200
    ports:
      - "8090:8080"
    depends_on:
      lancamentos-api:
        condition: service_started
      consolidado-api:
        condition: service_started

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    mem_limit: 1g
    depends_on:
      elasticsearch:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - lancamentos-api
      - consolidado-api
      - background-server

  grafana:
    image: grafana/grafana:11.5.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  kafkadata:
  esdata:
  promdata:
  grafanadata:

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: lancamentos
    metrics_path: /metrics
    static_configs:
      - targets: ["lancamentos-api:8080"]
        labels:
          service: lancamentos

  - job_name: consolidado
    metrics_path: /metrics
    static_configs:
      - targets: ["consolidado-api:8080"]
        labels:
          service: consolidado

  - job_name: background-server
    metrics_path: /metrics
    static_configs:
      - targets: ["background-server:8080"]
        labels:
          service: background-server

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
